<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Care Timeline | PetNest</title><link rel="stylesheet" href="style.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body><header class="app-header"><a class="logo" href="dashboard.html"><i class='bx bxs-dog'></i> PetNest</a><nav><a href="dashboard.html">Dashboard</a><a href="pet-profile.html">Pet Profile</a><a href="health.html">Wellness</a><a href="vaccinations.html">Vaccines</a><a href="reminders.html">Reminders</a><a href="timeline.html">Timeline</a></nav><button class="btn btn-small" onclick="logout()">Logout</button></header>
<main class="app-main"><div class="page-title"><div><span class="eyebrow">PET HISTORY</span><h1>Care Timeline</h1><p>See important events as one chronological story.</p></div></div>
<form class="form-card" onsubmit="event.preventDefault();addTimelineEvent();"><h2>Add a timeline event</h2><div class="form-grid"><label>Event title<input id="timeline-title" required placeholder="e.g. First grooming"></label><label>Date<input id="timeline-date" type="date" required></label><label>Type<select id="timeline-type"><option>General</option><option>Health</option><option>Vaccination</option><option>Vet</option><option>Grooming</option><option>Milestone</option></select></label></div><label>Details<textarea id="timeline-details" rows="3"></textarea></label><button class="btn" type="submit">Add Event</button><p id="timeline-message" class="form-message"></p></form>
<section class="dashboard-card"><div class="card-head"><h2>Pet care history</h2><button class="text-btn" onclick="clearTimeline()">Clear timeline</button></div><div id="timeline-list" class="timeline"></div></section></main><script src="script.js"></script></body></html>
