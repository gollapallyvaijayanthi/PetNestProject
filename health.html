<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wellness Tracker | PetNest</title><link rel="stylesheet" href="style.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body><header class="app-header"><a class="logo" href="dashboard.html"><i class='bx bxs-dog'></i> PetNest</a><nav><a href="dashboard.html">Dashboard</a><a href="pet-profile.html">Pet Profile</a><a href="health.html">Wellness</a><a href="vaccinations.html">Vaccines</a><a href="reminders.html">Reminders</a><a href="timeline.html">Timeline</a></nav><button class="btn btn-small" onclick="logout()">Logout</button></header>
<main class="app-main"><div class="page-title"><div><span class="eyebrow">WELLNESS TRACKING</span><h1>Pet Wellness Center</h1><p>Record everyday observations and see patterns over time.</p></div></div>
<section class="dashboard-grid"><form class="form-card" onsubmit="event.preventDefault();saveHealthRecord();"><h2>Daily wellness log</h2><div class="form-grid"><label>Weight (kg)<input id="health-weight" type="number" min="0" step="0.1" required></label><label>Activity<select id="health-activity"><option>Low</option><option>Normal</option><option>High</option></select></label><label>Appetite<select id="health-appetite"><option>Normal</option><option>Increased</option><option>Reduced</option></select></label><label>Water intake<select id="health-water"><option>Normal</option><option>Increased</option><option>Reduced</option></select></label></div><label>Observation<textarea id="health-observation" rows="4" placeholder="Energy, sleep, stool, mood, exercise or anything you noticed..."></textarea></label><button class="btn full" type="submit">Save Wellness Record</button><p id="health-message" class="form-message"></p></form>
<article class="dashboard-card"><div class="card-head"><h2>Trend analyzer</h2><span class="tag">No diagnosis</span></div><div id="analyzer-result" class="analyzer-result"><p>Add records to review changes.</p></div><button class="btn btn-light full" onclick="analyzeWellness()">Analyze My Trends</button></article></section>
<section class="dashboard-card"><div class="card-head"><h2>Wellness history</h2><button class="text-btn" onclick="clearHealthHistory()">Clear history</button></div><div id="health-records" class="record-list"></div></section></main><script src="script.js"></script></body></html>
